name: Build Hertz Android APK

# No path filters: an APK is produced on EVERY push that deploys the web app.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hertz-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Test, compile and package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout the exact deployment revision
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java 21 for Capacitor Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test the audio engine and QR presets
        run: npm test
      - name: Build the offline web assets for Android
        run: npm run build
      - name: Generate the native Android project
        run: npx cap add android
      - name: Copy built assets into the Android package
        run: npx cap sync android
      - name: Build installable debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK for this deployment
        uses: actions/upload-artifact@v4
        with:
          name: hertz-android-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
